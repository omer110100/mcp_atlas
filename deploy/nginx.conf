worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    absolute_redirect off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 20s;
    # A shared origin ceiling: do not trust arbitrary client-forwarded IP headers.
    # The large burst accommodates image-heavy atlas loads and concurrent visitors.
    limit_req_zone $server_name zone=atlas_origin:1m rate=300r/s;
    limit_req_status 429;
    limit_req_log_level warn;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    server {
        listen 8080;
        server_name maple.omerlabinsky.com;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Cache-Control "no-cache" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        location = /healthz { default_type text/plain; return 200 "ok\n"; }
        location / {
            limit_req zone=atlas_origin burst=600 nodelay;
            try_files $uri $uri/ =404;
        }
        location ~ /\. { return 404; }
    }
}
